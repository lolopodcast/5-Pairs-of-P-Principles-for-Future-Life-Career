<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Pairs of P-Principles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 16px;
            padding: 20px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg">
        <!-- Definitions for shadows -->
        <defs>
            <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Background grid (optional, for aesthetics) -->
        <rect width="800" height="750" fill="#ffffff" rx="16" />

        <!-- Titles -->
        <text x="400" y="80" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e3a8a">
            5 Pairs of P-Principles for future life &amp; work career
        </text>
        <text x="720" y="130" text-anchor="end" font-size="22" font-style="italic" fill="#475569">
            by Prof. Shihmin Lo, NCNU
        </text>

        <!-- Connecting Lines -->
        <g stroke="#cbd5e1" stroke-width="3" fill="none">
            <!-- Center to Outer -->
            <line x1="400" y1="420" x2="400" y2="220" />
            <line x1="400" y1="420" x2="620" y2="420" />
            <line x1="400" y1="420" x2="400" y2="620" />
            <line x1="400" y1="420" x2="180" y2="420" />
            
            <!-- Outer Diamond -->
            <line x1="400" y1="220" x2="620" y2="420" />
            <line x1="620" y1="420" x2="400" y2="620" />
            <line x1="400" y1="620" x2="180" y2="420" />
            <line x1="180" y1="420" x2="400" y2="220" />
        </g>

        <!-- Node: Top (Passion & Purpose) -->
        <g transform="translate(400, 220)">
            <circle cx="0" cy="0" r="85" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Passion</text>
            <text x="0" y="10" text-anchor="middle" font-size="16" fill="#475569">&amp;</text>
            <text x="0" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Purpose</text>
        </g>

        <!-- Node: Right (Profession & Progress) -->
        <g transform="translate(620, 420)">
            <circle cx="0" cy="0" r="85" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Profession</text>
            <text x="0" y="10" text-anchor="middle" font-size="16" fill="#475569">&amp;</text>
            <text x="0" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Progress</text>
        </g>

        <!-- Node: Bottom (Peers & Partners) -->
        <g transform="translate(400, 620)">
            <circle cx="0" cy="0" r="85" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Peers</text>
            <text x="0" y="10" text-anchor="middle" font-size="16" fill="#475569">&amp;</text>
            <text x="0" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Partners</text>
        </g>

        <!-- Node: Left (Payoff & Prosperity) -->
        <g transform="translate(180, 420)">
            <circle cx="0" cy="0" r="85" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Payoff</text>
            <text x="0" y="10" text-anchor="middle" font-size="16" fill="#475569">&amp;</text>
            <text x="0" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Prosperity</text>
        </g>

        <!-- Node: Center (Patience & Persistence) -->
        <g transform="translate(400, 420)">
            <circle cx="0" cy="0" r="95" fill="#fef08a" stroke="#ca8a04" stroke-width="4" filter="url(#drop-shadow)"/>
            <text x="0" y="-15" text-anchor="middle" font-size="22" font-weight="bold" fill="#713f12">Patience</text>
            <text x="0" y="10" text-anchor="middle" font-size="18" fill="#a16207">&amp;</text>
            <text x="0" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#713f12">Persistence</text>
        </g>

    </svg>
</div>

</body>
</html>
